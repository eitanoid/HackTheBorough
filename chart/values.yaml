# Resource names and in-cluster URLs assume the Skaffold release name
# "hacktheburgh" (see skaffold.yaml).
frontend:
  replicaCount: 1
  image:
    repository: hacktheburgh/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 3000
    nodePort: 30080

backend:
  replicaCount: 1
  image:
    repository: hacktheburgh/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
    targetPort: 8080
    nodePort: 30081
  env:
    - name: PG_USER
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-postgres
          key: POSTGRES_USER
    - name: PG_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-postgres
          key: POSTGRES_PASSWORD
    - name: PG_DB
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-postgres
          key: POSTGRES_DB
    - name: DATABASE_URL
      value: "postgres://$(PG_USER):$(PG_PASSWORD)@hacktheburgh-postgres:5432/$(PG_DB)?sslmode=disable"
    - name: OPENAPI_KEY
      valueFrom:
        secretKeyRef:
          name: openai-key
          key: API_KEY
    - name: LLM_BASE_URL
      value: "https://api.openai.com/v1"
    - name: LLM_MODEL_PROFILER
      value: "gpt-4.1-mini"
    - name: LLM_MODEL_AUTHOR
      value: "gpt-4.1"
    - name: LLM_MODEL_INVESTIGATOR
      value: "gpt-4.1"
    - name: LLM_MODEL_REVIEWER
      value: "gpt-4.1"
    - name: LLM_MODEL_NARRATOR
      value: "gpt-4.1-mini"
    - name: LLM_DEBUG # "1" exposes POST /api/debug/chat; turn off outside dev
      value: "1"
    - name: CRAWL4AI_API
      value: "http://hacktheburgh-crawl4ai:11235"
    - name: CRAWL4AI_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-crawl4ai
          key: CRAWL4AI_API_TOKEN
    - name: CRAWL4AI_PROVIDER
      value: "openai/gpt-4o-mini"
    - name: INGEST_MAX_PAR
      value: "1"

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    username: hacktheburgh
    password: hacktheburgh
    database: hacktheburgh
  persistence:
    size: 1Gi
  service:
    port: 5432
    nodePort: 30082

crawl4ai:
  replicaCount: 1
  image:
    repository: unclecode/crawl4ai
    tag: "0.9.5"
    pullPolicy: IfNotPresent
  env:
    - name: CRAWL4AI_API_TOKEN
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-crawl4ai
          key: CRAWL4AI_API_TOKEN
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: openai-key
          key: API_KEY
    - name: LLM_PROVIDER
      # OpenAI only. The Crawl4AI pod receives the key as OPENAI_API_KEY.
      value: openai/gpt-4o-mini
  service:
    port: 11235
