frontend:
  replicaCount: 1
  image:
    repository: hacktheburgh/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 5173
    nodePort: 30080

backend:
  replicaCount: 1
  image:
    repository: hacktheburgh/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
    targetPort: 8080
    nodePort: 30081
  env:
    - name: OPENAPI_KEY
      valueFrom:
        secretKeyRef:
          name: openapi-key
          key: API_KEY

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    username: hacktheburgh
    password: hacktheburgh
    database: hacktheburgh
  persistence:
    size: 1Gi
  service:
    port: 5432
