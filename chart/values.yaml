frontend:
  replicaCount: 1
  image:
    repository: hacktheburgh/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 80
    targetPort: 3000
    nodePort: 30080

backend:
  replicaCount: 1
  image:
    repository: hacktheburgh/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 8080
    targetPort: 8080
    nodePort: 30081
  env:
    - name: PG_USER
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-postgres
          key: POSTGRES_USER
    - name: PG_PASSWORD
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-postgres
          key: POSTGRES_PASSWORD
    - name: PG_DB
      valueFrom:
        secretKeyRef:
          name: hacktheburgh-postgres
          key: POSTGRES_DB
    - name: DATABASE_URL
      value: "postgres://$(PG_USER):$(PG_PASSWORD)@hacktheburgh-postgres:5432/$(PG_DB)?sslmode=disable"
    - name: OPENAPI_KEY
      valueFrom:
        secretKeyRef:
          name: openai-key
          key: API_KEY
    - name: LLM_BASE_URL
      value: "https://api.openai.com/v1"
    - name: LLM_MODEL_PROFILER
      value: "gpt-4.1-mini"
    - name: LLM_MODEL_AUTHOR
      value: "gpt-4.1"
    - name: LLM_MODEL_INVESTIGATOR
      value: "gpt-4.1"
    - name: LLM_MODEL_REVIEWER
      value: "gpt-4.1"
    - name: LLM_MODEL_NARRATOR
      value: "gpt-4.1-mini"
    - name: LLM_DEBUG # "1" exposes POST /api/debug/chat; turn off outside dev
      value: "1"

postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent
  auth:
    username: hacktheburgh
    password: hacktheburgh
    database: hacktheburgh
  persistence:
    size: 1Gi
  service:
    port: 5432
