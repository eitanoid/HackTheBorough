apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hacktheburgh.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "hacktheburgh.fullname" . }}-postgres
                  key: POSTGRES_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hacktheburgh.fullname" . }}-postgres
                  key: POSTGRES_PASSWORD
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "hacktheburgh.fullname" . }}-postgres
                  key: POSTGRES_DB
            - name: DATABASE_URL
              value: "postgres://$(PG_USER):$(PG_PASSWORD)@{{ include "hacktheburgh.fullname" . }}-postgres:{{ .Values.postgres.service.port }}/$(PG_DB)?sslmode=disable"
            {{- if .Values.backend.env }}
            {{- toYaml .Values.backend.env | nindent 12 }}
            {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hacktheburgh.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      nodePort: {{ .Values.backend.service.nodePort }}
