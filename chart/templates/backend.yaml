apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hacktheburgh.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - name: LLM_BASE_URL
              value: {{ .Values.backend.llm.baseUrl | quote }}
            - name: LLM_MODEL_PROFILER
              value: {{ .Values.backend.llm.models.profiler | quote }}
            - name: LLM_MODEL_AUTHOR
              value: {{ .Values.backend.llm.models.author | quote }}
            - name: LLM_MODEL_INVESTIGATOR
              value: {{ .Values.backend.llm.models.investigator | quote }}
            - name: LLM_MODEL_REVIEWER
              value: {{ .Values.backend.llm.models.reviewer | quote }}
            - name: LLM_MODEL_NARRATOR
              value: {{ .Values.backend.llm.models.narrator | quote }}
            - name: LLM_DEBUG
              value: {{ ternary "1" "0" .Values.backend.llm.debug | quote }}
            {{- if .Values.backend.env }}
            {{- toYaml .Values.backend.env | nindent 12 }}
            {{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hacktheburgh.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      nodePort: {{ .Values.backend.service.nodePort }}
