apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hacktheburgh.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ include "hacktheburgh.fullname" . }}-backend-llm
          {{- if .Values.backend.env }}
          env: {{ toYaml .Values.backend.env | nindent 10 }}
          {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hacktheburgh.fullname" . }}-backend-llm
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  LLM_BASE_URL: {{ .Values.backend.llm.baseUrl | quote }}
  LLM_MODEL_PROFILER: {{ .Values.backend.llm.models.profiler | quote }}
  LLM_MODEL_AUTHOR: {{ .Values.backend.llm.models.author | quote }}
  LLM_MODEL_INVESTIGATOR: {{ .Values.backend.llm.models.investigator | quote }}
  LLM_MODEL_REVIEWER: {{ .Values.backend.llm.models.reviewer | quote }}
  LLM_MODEL_NARRATOR: {{ .Values.backend.llm.models.narrator | quote }}
  LLM_DEBUG: {{ ternary "1" "0" .Values.backend.llm.debug | quote }}

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hacktheburgh.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      nodePort: {{ .Values.backend.service.nodePort }}
