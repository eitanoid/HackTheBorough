apiVersion: apps/v1
kind: Deployment
metadata:
  name: hacktheburgh-crawl4ai
  labels:
    app.kubernetes.io/name: crawl4ai
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.crawl4ai.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: crawl4ai
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crawl4ai
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: crawl4ai
          image: "{{ .Values.crawl4ai.image.repository }}:{{ .Values.crawl4ai.image.tag }}"
          imagePullPolicy: {{ .Values.crawl4ai.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.crawl4ai.service.port }}
          {{- if .Values.crawl4ai.env }}
          env: {{ toYaml .Values.crawl4ai.env | nindent 10 }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: hacktheburgh-crawl4ai
  labels:
    app.kubernetes.io/name: crawl4ai
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: crawl4ai
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.crawl4ai.service.port }}
      targetPort: http
