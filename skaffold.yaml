apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: hacktheburgh

build:
  local:
    push: false
  artifacts:
    - image: hacktheburgh/frontend
      context: svc/frontend
      docker:
        dockerfile: Dockerfile
        buildArgs:
          BACKEND_API_URL: http://hacktheburgh-backend:8080
    - image: hacktheburgh/backend
      context: svc/backend
      docker:
        dockerfile: Dockerfile

manifests:
  helm:
    releases:
      - name: hacktheburgh
        chartPath: chart
        setValueTemplates:
          frontend.image.repository: "{{.IMAGE_REPO_hacktheburgh_frontend}}"
          frontend.image.tag: "{{.IMAGE_TAG_hacktheburgh_frontend}}"
          backend.image.repository: "{{.IMAGE_REPO_hacktheburgh_backend}}"
          backend.image.tag: "{{.IMAGE_TAG_hacktheburgh_backend}}"

deploy:
  helm: {}
