#json=https://raw.githubusercontent.com/alexchen-sys/schemastore/4cc684d8c1bafe0073e7e2d6376375fdd64af90c/src/schemas/json/kind-cluster.json
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hacktheburgh
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 31000
        hostPort: 10001
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
      - containerPort: 30081
        hostPort: 8081
        protocol: TCP
